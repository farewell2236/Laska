name: Update difficulty data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/build_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Build song data
        run: python -u scripts/build_data.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/songs.js data/songs.json; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/songs.js data/songs.json
          git commit -m "Update difficulty data"

          # The branch may have advanced while the scraper was running.
          # Rebase the generated-data commit onto the latest main before push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
