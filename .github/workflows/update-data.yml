name: Update difficulty data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/build_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Build song data
        run: python -u scripts/build_data.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/songs.js data/songs.json; then
            echo "No data changes"
            exit 0
          fi

          # Keep the newly generated files outside the repository temporarily.
          mkdir -p /tmp/iidx-generated
          cp data/songs.js /tmp/iidx-generated/songs.js
          cp data/songs.json /tmp/iidx-generated/songs.json

          # Move to the latest remote main branch.
          # Generated data is restored afterward, so conflicts in those files cannot occur.
          git fetch origin main
          git reset --hard origin/main

          cp /tmp/iidx-generated/songs.js data/songs.js
          cp /tmp/iidx-generated/songs.json data/songs.json

          if git diff --quiet -- data/songs.js data/songs.json; then
            echo "Latest main already contains the same data"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/songs.js data/songs.json
          git commit -m "Update difficulty data"
          git push origin HEAD:main
